<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michelle's Page</title>

  <!-- Inter font from Google Fonts (needs internet) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

  <!-- Link to our CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- The "stage" is the big grass background. Everything sits on top of it. -->
  <main class="stage">

    <!-- Pink greeting -->
    <h1 class="title">hi!<br>welcome<br>to my<br>page</h1>

    <!-- Star decoration -->
    <img class="star" src="images/teal%20star.png" alt="A decorative plaid and teal paper star with a button">

    <!-- Stamp: the blank stamp image with the photo placed inside it -->
    <div class="stamp">
      <img class="stamp-frame" src="images/stamp.png" alt="">
      <img class="stamp-photo" src="images/photo.jpg" alt="Photo of Michelle">
    </div>

    <!-- Black star: not in your design. Delete the arrows on this line and the next to show it.
    <img class="black-star" src="images/black%20star.png" alt="Black halftone star">
    -->


    <!-- Envelope with the letter inside (the letter text is real text on top of the image) -->
    <div class="envelope">
      <img class="envelope-img" src="images/letter.png" alt="">
      <div class="letter-text">
        <p class="name">Michelle G. Fudinata<br>(傅蜜雪)<br>Indonesian based in Taipei</p>
        <p class="about">currently a junior year<br>communication design<br>student majoring in<br>animation and moving image</p>
      </div>
    </div>

    <!-- Embroidered fish patches (one image with both fish) -->
    <img class="fish" src="images/fish.png" alt="Two embroidered fish patches">

  </main>

</body>
</html>
